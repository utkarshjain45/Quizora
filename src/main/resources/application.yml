spring:
  application:
    name: Quizora
  profiles:
    active: local

server:
  port: 8080

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

application:
  security:
    jwt:
      SECRET_KEY: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION}
